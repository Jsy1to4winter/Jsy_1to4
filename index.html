<script>

const defaults={name:'个人主页',bio:'在这里写下你的个人简介。',tags:[],posts:0,fans:0,following:0,email:'',avatar:'',cards:[{icon:'✦',title:'关于我',summary:'点击了解我的个人介绍',detail:'这里可以写你的经历、性格和个人故事。'},{icon:'♡',title:'兴趣爱好',summary:'记录我喜欢的一切',detail:'这里可以介绍喜欢的音乐、电影、游戏和日常。'},{icon:'◈',title:'我的经历',summary:'一些值得分享的故事',detail:'这里可以填写学习、工作和生活经历。'},{icon:'✉',title:'联系我',summary:'期待与你交流',detail:'这里可以写联系方式或想对来访者说的话。'}]};
const key=PROFILE_SLUG==='fuguang'?'my-profile-v1':'my-profile-v1:'+PROFILE_SLUG;let data;try{data={...defaults,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{data=structuredClone(defaults)};
const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}

$('editBtn').onclick=openEditor;$('cancelBtn').onclick=()=>$('modal').classList.remove('open');$('saveBtn').onclick=()=>{data.name=$('nameInput').value;data.bio=$('bioInput').value;data.tags=$('tagsInput').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);data.posts=+$('postsInput').value;data.fans=+$('fansInput').value;data.following=+$('followingInput').value;data.email=$('emailInput').value;document.querySelectorAll('[data-k]').forEach(el=>data.cards[+el.dataset.i][el.dataset.k]=el.value);persist();render();$('modal').classList.remove('open');toast('已保存')};
$('avatar').onclick=$('avatarPlus').onclick=()=>$('avatarFile').click();$('avatarFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{data.avatar=r.result;persist();render()};r.readAsDataURL(f)};

$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的个人主页资料.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.cards))throw Error();data={...defaults,...obj};persist();render();openEditor();toast('导入成功')}catch{toast('导入失败：文件格式不正确')}};render();

<script id="owner-export-script">
(function(){

 btn.onclick=async()=>{
  btn.disabled=true;btn.textContent='正在打包图片和音乐…';

   const all=await Promise.all(['gallery','experience','contact','music'].map(t=>mediaAll(t)));

   };
   state[aboutKey]=JSON.stringify([about]);

   html=html.replace(/<script src="cloud-sync.js"><\/script>/,'').replace(/<script src="profile-access.js"><\/script>/,'').replace(/<script id="v18-lock-script">[\s\S]*?<\/script>/,'');
   html=html.replace("const PROFILE_SLUG=new URLSearchParams(location.search).get('profile') ?? 'fuguang';", 'const PROFILE_SLUG='+JSON.stringify(PROFILE_SLUG)+';');
   html=html.replaceAll('localStorage.getItem(', 'window.__visitorGetItem(');
   html=html.replace('async function mediaAll(type){','async function mediaAll(type){if(window.__visitorMedia){return Promise.all(window.__visitorMedia.filter(x=>x.type===type).map(async x=>({id:x.id,type:x.type,name:x.name,file:await (await fetch(x.fileData)).blob()})))}');
   const boot=`<script id="visitor-embedded">window.__visitorState=${JSON.stringify(state).replace(/</g,'\\u003c')};window.__visitorMedia=${JSON.stringify(media).replace(/</g,'\\u003c')};window.__visitorGetItem=function(k){return Object.prototype.hasOwnProperty.call(window.__visitorState,k)?window.__visitorState[k]:null};<\/script>`;
   html=html.replace('<head>','<head>'+boot);
   const guard=`<style id="visitor-guard-style">#avatarPlus,.avatar-wrap .plus,.gallery-add,.gallery-delete,.mini-edit,.about-edit,.music-upload,#commentManager,#aboutEditor,#modal,#avatarFile,#galleryInput,#aboutImageFile,#musicInput{display:none!important}#editBtn{opacity:1!important;cursor:default!important}#avatar{cursor:default!important}.about-photo{cursor:default!important}</style><script id="visitor-guard-script">(function(){function lock(){const b=document.getElementById('editBtn');if(b){b.onclick=function(e){e.preventDefault()};b.title='访客展示模式';}const av=document.getElementById('avatar');if(av)av.onclick=null;const plus=document.getElementById('avatarPlus');if(plus)plus.onclick=null;const oldShowAbout=window.showAbout;if(oldShowAbout)window.showAbout=function(){oldShowAbout();document.querySelectorAll('.about-photo').forEach(b=>b.onclick=null)};const oldSection=window.showSection;if(oldSection)window.showSection=async function(s){await oldSection(s);document.querySelectorAll('.gallery-delete,.gallery-add,.mini-edit').forEach(b=>b.remove())};const oldMusic=window.makeMusicHeader;if(oldMusic)window.makeMusicHeader=function(){const w=oldMusic();w.querySelectorAll('.music-upload').forEach(b=>b.remove());return w};const oldImage=window.imageButton;if(oldImage)window.imageButton=function(){const b=oldImage();b.onclick=null;return b};}loadMusic();lock()})();<\/script>`;
   html=html.replace('</body>',guard+'</body>');
   const blob=new Blob([html],{type:'text/html;charset=utf-8'});
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),15000);
   toast('访客版已导出：index.html');
  }catch(e){console.error(e);alert('导出失败：'+(e.message||e))}finally{btn.disabled=false;btn.textContent='↗ 导出访客版 HTML'}
 };

 $id('unlockSubmit').disabled=true;
 try{await window.profileLogin(email,password);
 // 登录成功不代表具备编辑权；RLS 在云端保存时验证 owner_id。
 unlocked=await window.cloudCanEdit();if(!unlocked)throw Error('此账号不是主页管理员');refresh();hideLock();$id('lockPassword').value='';toast('已解锁此主页的编辑权限');
 }catch(e){$id('lockError').textContent='登录失败：'+e.message}
 finally{$id('unlockSubmit').disabled=false}
}
lock.addEventListener('click',async()=>{if(unlocked){await profileSupabase.auth.signOut();unlocked=false;document.body.classList.remove('v16-managing');document.querySelectorAll('#modal,#aboutEditor,#commentManager').forEach(x=>x?.classList.remove('open'));refresh();toast('已退出管理员登录');}else showLock()});
$id('lockCancel').onclick=hideLock;$id('unlockSubmit').onclick=doUnlock;$id('lockPassword').addEventListener('keydown',e=>{if(e.key==='Enter')doUnlock()});
$id('lockDialog').addEventListener('click',e=>{if(e.target===$id('lockDialog'))hideLock()});
// 捕获阶段拦截编辑入口，防止已有旧版点击事件绕过锁。
$id('editBtn').addEventListener('click',e=>{if(!unlocked){e.preventDefault();e.stopImmediatePropagation();showLock()}},true);
for(const id of ['avatar','avatarPlus']){const el=$id(id);if(el)el.addEventListener('click',e=>{if(!unlocked){e.preventDefault();e.stopImmediatePropagation();showLock()}},true)}
// 禁止锁定状态下通过旧版编辑入口触发修改。
document.addEventListener('click',e=>{if(unlocked)return;const edit=e.target.closest('#homeIntroEdit,.intro-edit,.about-edit,.mini-edit,.gallery-add,.gallery-delete,.music-upload');if(edit){e.preventDefault();e.stopImmediatePropagation();showLock()}},true);
refresh();
profileSupabase.auth.onAuthStateChange(()=>{setTimeout(async()=>{unlocked=await window.cloudCanEdit();refresh()},0)});
setTimeout(async()=>{unlocked=await window.cloudCanEdit();refresh()},0);
})();
</script>

</body></html>
